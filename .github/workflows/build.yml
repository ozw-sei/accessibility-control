name: Build & Test

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

env:
  GRADLE_VERSION: '8.5'
  JAVA_VERSION: '17'

jobs:
  version-script:
    name: Release version script
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # actions/checkout@v4.4.0
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Check tag to version mapping
        run: bash .github/scripts/release-version.test.sh

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        # actions/checkout@v4.4.0
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        # actions/setup-java@v4.9.1
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Setup Gradle
        # gradle/actions/setup-gradle@v4.4.3
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a

      - name: Generate wrapper if missing
        if: ${{ !hashFiles('gradle/wrapper/gradle-wrapper.jar') }}
        run: |
          gradle wrapper --gradle-version ${{ env.GRADLE_VERSION }}
          chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Upload test results
        if: always()
        # actions/upload-artifact@v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unit-test-results
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 14

  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        # actions/checkout@v4.4.0
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        # actions/setup-java@v4.9.1
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Setup Gradle
        # gradle/actions/setup-gradle@v4.4.3
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a

      - name: Generate wrapper if missing
        if: ${{ !hashFiles('gradle/wrapper/gradle-wrapper.jar') }}
        run: |
          gradle wrapper --gradle-version ${{ env.GRADLE_VERSION }}
          chmod +x gradlew

      - name: Run lint
        run: ./gradlew lintDebug --no-daemon

      - name: Upload lint results
        if: always()
        # actions/upload-artifact@v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lint-results
          path: app/build/reports/lint-results-debug.html
          retention-days: 14

  build:
    name: Build APK
    needs: [ unit-test, lint ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        # actions/checkout@v4.4.0
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        # actions/setup-java@v4.9.1
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Setup Gradle
        # gradle/actions/setup-gradle@v4.4.3
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a

      - name: Generate wrapper if missing
        if: ${{ !hashFiles('gradle/wrapper/gradle-wrapper.jar') }}
        run: |
          gradle wrapper --gradle-version ${{ env.GRADLE_VERSION }}
          chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Prepare artifacts
        run: |
          set -euo pipefail
          short_sha=${GITHUB_SHA::7}
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk \
            "artifacts/accessibility-control-debug-${short_sha}.apk"
          cp app/build/outputs/apk/release/app-release.apk \
            "artifacts/accessibility-control-release-${short_sha}.apk"

      - name: Upload debug APK
        # actions/upload-artifact@v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: apk-debug-${{ github.sha }}
          path: artifacts/*debug*.apk
          retention-days: 30
          compression-level: 0
          if-no-files-found: error

      - name: Upload release APK
        # actions/upload-artifact@v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: apk-release-${{ github.sha }}
          path: artifacts/*release*.apk
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
