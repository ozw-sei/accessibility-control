name: Release

# タグ push だけで GitHub Release を作る。
# 署名はリポジトリの app/debug.keystore（release ビルド種別）。
# Device Owner のまま更新するため鍵は変えない。ANDROID_* secrets は使わない。
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  GRADLE_VERSION: "8.5"
  JAVA_VERSION: "17"
  APP_SLUG: accessibility-control

jobs:
  verify:
    name: Verify tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Checkout
        # actions/checkout@v4.4.0
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Require the tag commit on the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          # checkout は persist-credentials: false なので、fetch のときだけ Basic 認証する。
          # git config には残さない。
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth_header="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"
          git -c "http.extraheader=AUTHORIZATION: basic ${auth_header}" \
            fetch --no-tags origin \
            "+refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
          unset auth_header
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/${DEFAULT_BRANCH}"; then
            echo "::error::タグ ${GITHUB_REF_NAME} のコミット ${GITHUB_SHA} は ${DEFAULT_BRANCH} の履歴に含まれていません。リリースタグはデフォルトブランチに含まれるコミットへ打ってください。"
            exit 1
          fi

      - name: Resolve version from tag
        id: version
        run: |
          set -euo pipefail
          bash .github/scripts/release-version.test.sh
          bash .github/scripts/release-version.sh "${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        # actions/checkout@v4.4.0
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        # actions/setup-java@v4.9.1
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      - name: Setup Gradle
        # gradle/actions/setup-gradle@v4.4.3
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a

      - name: Generate wrapper if missing
        if: ${{ !hashFiles('gradle/wrapper/gradle-wrapper.jar') }}
        run: |
          gradle wrapper --gradle-version ${{ env.GRADLE_VERSION }}
          chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Upload test results
        if: always()
        # actions/upload-artifact@v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unit-test-results
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 14

  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        # actions/checkout@v4.4.0
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        # actions/setup-java@v4.9.1
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      - name: Setup Gradle
        # gradle/actions/setup-gradle@v4.4.3
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a

      - name: Generate wrapper if missing
        if: ${{ !hashFiles('gradle/wrapper/gradle-wrapper.jar') }}
        run: |
          gradle wrapper --gradle-version ${{ env.GRADLE_VERSION }}
          chmod +x gradlew

      - name: Run lint
        run: ./gradlew lintDebug --no-daemon

      - name: Upload lint results
        if: always()
        # actions/upload-artifact@v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lint-results
          path: app/build/reports/lint-results-debug.html
          retention-days: 14

  build:
    name: Build signed release APK
    needs: [verify, unit-test, lint]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        # actions/checkout@v4.4.0
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        # actions/setup-java@v4.9.1
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      - name: Setup Gradle
        # gradle/actions/setup-gradle@v4.4.3
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a

      - name: Generate wrapper if missing
        if: ${{ !hashFiles('gradle/wrapper/gradle-wrapper.jar') }}
        run: |
          gradle wrapper --gradle-version ${{ env.GRADLE_VERSION }}
          chmod +x gradlew

      - name: Build release APK
        env:
          VERSION_NAME: ${{ needs.verify.outputs.version_name }}
          VERSION_CODE: ${{ needs.verify.outputs.version_code }}
        run: |
          set -euo pipefail
          ./gradlew assembleRelease --no-daemon \
            -PversionName="$VERSION_NAME" \
            -PversionCode="$VERSION_CODE"

      - name: Name APK and write sha256
        env:
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set -euo pipefail
          src="app/build/outputs/apk/release/app-release.apk"
          if [[ ! -f "$src" ]]; then
            echo "::error::署名済み release APK が ${src} にありません"
            ls -la app/build/outputs/apk/release || true
            exit 1
          fi
          mkdir -p dist
          apk="${APP_SLUG}-${TAG}.apk"
          cp "$src" "dist/${apk}"
          (
            cd dist
            sha256sum "${apk}" > "${apk}.sha256"
            sha256sum -c "${apk}.sha256"
          )

      - name: Upload release files
        # actions/upload-artifact@v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-${{ github.sha }}
          path: |
            dist/${{ env.APP_SLUG }}-${{ needs.verify.outputs.tag }}.apk
            dist/${{ env.APP_SLUG }}-${{ needs.verify.outputs.tag }}.apk.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  release:
    name: Publish GitHub Release
    needs: [verify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      # このジョブは checkout しない。gh は GH_REPO がないとリポジトリを決められない。
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download release files
        # actions/download-artifact@v4.3.0
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-${{ github.sha }}
          path: dist

      - name: Require exactly one APK and its sha256
        env:
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set -euo pipefail
          mapfile -t files < <(find dist -type f | sort)
          if [[ ${#files[@]} -ne 2 ]]; then
            echo "::error::Release に載せるファイルは APK と sha256 の2つだけです (found ${#files[@]})"
            printf '%s\n' "${files[@]}"
            exit 1
          fi
          apk="$(find dist -type f -name "${APP_SLUG}-${TAG}.apk" -print -quit)"
          sum="$(find dist -type f -name "${APP_SLUG}-${TAG}.apk.sha256" -print -quit)"
          if [[ -z "${apk}" || -z "${sum}" ]]; then
            echo "::error::${APP_SLUG}-${TAG}.apk と .sha256 が必要です"
            printf '%s\n' "${files[@]}"
            exit 1
          fi
          (
            cd "$(dirname "$sum")"
            sha256sum -c "$(basename "$sum")"
          )
          mkdir -p publish
          cp "$apk" "publish/$(basename "$apk")"
          cp "$sum" "publish/$(basename "$sum")"

      - name: Create GitHub Release
        env:
          TAG: ${{ needs.verify.outputs.tag }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          set -euo pipefail
          # ビルド後にタグが動かされていたら、別コミットの Release を作らない。
          if ! object="$(gh api "repos/${GH_REPO}/git/ref/tags/${TAG}" --jq '.object.type + " " + .object.sha')"; then
            echo "::error::タグ ${TAG} がリモートにありません。ビルドしたコミットは ${GITHUB_SHA} です。"
            exit 1
          fi
          tag_type="${object%% *}"
          tag_sha="${object##* }"
          for _ in 1 2 3 4 5; do
            [[ "$tag_type" == "tag" ]] || break
            if ! object="$(gh api "repos/${GH_REPO}/git/tags/${tag_sha}" --jq '.object.type + " " + .object.sha')"; then
              echo "::error::タグ ${TAG} の指すコミットを解決できませんでした。"
              exit 1
            fi
            tag_type="${object%% *}"
            tag_sha="${object##* }"
          done
          if [[ "$tag_type" != "commit" || "$tag_sha" != "$GITHUB_SHA" ]]; then
            echo "::error::タグ ${TAG} は ${tag_sha} (${tag_type}) を指しています。ビルドしたコミットは ${GITHUB_SHA} です。"
            exit 1
          fi
          args=(--verify-tag --title "$TAG" --generate-notes)
          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi
          gh release create "$TAG" "${args[@]}" \
            "publish/${APP_SLUG}-${TAG}.apk" \
            "publish/${APP_SLUG}-${TAG}.apk.sha256"
